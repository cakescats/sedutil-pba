name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitVersion.sh runs git describe
      - name: Hash and config tests
        run: make -C tests/host check
      - name: Native build of sedutil-cli and linuxpba
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake
          autoreconf -i
          ./configure LDFLAGS=-static
          # same version string as the PBA image (scripts/build.sh)
          if ver=$(git describe --tags --match 'v*' --dirty 2>/dev/null); then
            ver=${ver#v}
          else
            ver="$(cat VERSION)+g$(git rev-parse --short HEAD)"
          fi
          echo "#define GIT_VERSION \"$ver\"" > linux/Version.h
          make -j"$(nproc)"
          ./sedutil-cli --validatePBKDF2 | tail -1
          mkdir -p cli && cp sedutil-cli cli/sedutil-cli-linux-x86_64
          (cd cli && sha256sum sedutil-cli-linux-x86_64 > sedutil-cli-linux-x86_64.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: sedutil-cli
          path: cli/

  image:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [default, hardened]
    env:
      CAKES_WORK: /home/runner/cakes-work
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe for the version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential \
            bzip2 cpio file flex libelf-dev libssl-dev rsync unzip wget xz-utils \
            qemu-system-x86 ovmf dosfstools

      - name: Download cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CAKES_WORK }}/dl
          key: dl-${{ hashFiles('scripts/build.sh', 'pba/configs/*') }}
          restore-keys: dl-

      - name: Build ${{ matrix.profile }} image
        run: scripts/build.sh --profile ${{ matrix.profile }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot test in QEMU
        run: |
          img=$(ls dist/cakes-pba-*-${{ matrix.profile }}.img)
          SHOT_WAIT=60 scripts/qemu-smoke.sh "$img" qemu-smoke

      - name: Image builder
        run: |
          img=$(ls dist/cakes-pba-*-${{ matrix.profile }}.img.gz)
          mkdir -p builder-test
          tools/cakes-builder.py build -i "$img" -o builder-test/custom.img \
            --set "title=Builder test" --set timeout=10 --logo branding/logo.png
          tools/cakes-builder.py show builder-test/custom.img
          # the rebuilt FAT must be clean
          dd if=builder-test/custom.img of=builder-test/esp.fat bs=1M skip=1 count=30 status=none
          fsck.fat -n builder-test/esp.fat
          SHOT_WAIT=60 scripts/qemu-smoke.sh builder-test/custom.img builder-test/qemu-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cakes-pba-${{ matrix.profile }}
          path: |
            dist/
            qemu-smoke/
            builder-test/qemu-smoke/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release made by hand from earlier CI builds keeps its assets
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists, not touching it"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "CakesCats PBA $GITHUB_REF_NAME" --notes "See README for how to install." \
            dist/*.img.gz dist/*.sha256 sedutil-cli-linux-x86_64 sedutil-cli-linux-x86_64.sha256 \
            tools/cakes-builder.py
