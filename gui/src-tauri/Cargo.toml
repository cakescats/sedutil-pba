[package]
name = "cakes-drives"
version = "0.1.0"
description = "Unlock and manage TCG Opal self-encrypting drives, a GUI for sedutil-cli"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
