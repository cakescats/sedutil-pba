# One EFI system partition, as the shadow MBR of the drive or on a USB stick.
# 32 MiB like the DTA images: OPAL drives have at least 128 MiB of shadow
# MBR, but --loadPBAimage writes the whole file, so smaller loads faster.
# The kernel, initramfs and GRUB take about 15 MiB.
# Fixed IDs keep the image reproducible.
image efi-part.vfat {
	vfat {
		extraargs = "-n CAKESPBA -i CA4E5CA7"
		file EFI {
			image = "efi-part/EFI"
		}
		file cakes {
			image = "efi-part/cakes"
		}
	}
	size = 30M
}

image cakes-pba.img {
	size = 32M
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "ca4e5ca7-0000-4000-8000-000000000001"
	}

	partition esp {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = "ca4e5ca7-0000-4000-8000-000000000002"
		offset = 1M
		bootable = true
	}
}
