# CakesCats PBA @VERSION@ boot menu.
#
# Press Esc while the PBA starts to see this menu. Kernel options go into
# cakes_args; cakes.<key>=<value> options are read by the PBA itself, see
# /etc/cakes-pba.conf in the image for the list (e.g. cakes.timeout=10).

set default=0
set timeout_style=hidden
set timeout=1
set gfxpayload=keep

insmod all_video
insmod efi_gop

set cakes_args="loglevel=0 libata.allow_tpm=1 reboot=warm"

menuentry "CakesCats PBA" {
	linux /cakes/bzImage $cakes_args
	initrd /cakes/rootfs.cpio.xz
}

menuentry "CakesCats PBA, single CPU (for machines that hang at boot)" {
	linux /cakes/bzImage $cakes_args nosmp
	initrd /cakes/rootfs.cpio.xz
}

#@service-begin
menuentry "CakesCats PBA, service mode (shell after unlocking)" {
	linux /cakes/bzImage $cakes_args cakes.mode=service
	initrd /cakes/rootfs.cpio.xz
}
#@service-end

menuentry "Reboot" {
	reboot
}

menuentry "UEFI firmware settings" {
	fwsetup
}
