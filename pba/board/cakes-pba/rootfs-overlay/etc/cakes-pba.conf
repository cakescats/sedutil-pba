# CakesCats PBA settings (default profile).
# Every key except service* can also be set on the kernel command line as
# cakes.<key>=<value>, in EFI/BOOT/grub.cfg on the PBA image.
# Nothing here is secret: anyone can read the shadow MBR without a password.

# Seconds to wait for a key after a password unlocked some but not all
# drives. A key lets you type another password for the rest.
# 0 = start the OS at once, -1 = keep asking until every drive is unlocked.
timeout = 3

# Seconds the result stays on screen before the reboot into the OS.
boot_delay = 1

# Password hashing schemes to try, in order: sha1[:iterations] (sedutil 1.x,
# default 75000) and/or sha512[:iterations] (default 500000).
# Every extra scheme costs one more failed attempt per drive on a wrong password.
hash = sha1:75000

# Reboot into the OS with a warm reset: some machines cut power to the
# drive on a cold reset, and it locks again. warm, cold or keep.
reboot = warm

# Service shell: on, off, or password (needs service_hash).
# Opened by typing service_word at the password prompt, by the "service
# mode" boot menu entry (after unlocking), or from the "no drives" screen.
service = on
service_word = debug
# service_hash = sha512:<iterations>:<salt hex>:<hash hex>   (tools/mkservicehash.py)

logo = on
title = CakesCats Pre-Boot Authorization
